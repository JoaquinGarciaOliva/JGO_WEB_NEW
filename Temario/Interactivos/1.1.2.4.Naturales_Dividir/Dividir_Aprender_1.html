<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Joaquín García Oliva">
    <meta name="description" content="Juego interactivo para aprender la división paso a paso visualizando las restas">   
    <title>División Paso a Paso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

 <div class="contenedor-principal">
    
    <header>
        <h1>División Paso a Paso 
            <label class="player-score">Puntuación: <span id="playerScore">0 / 0</span></label>
        </h1>
    </header>

    <div class="controls">
        <div class="control-group">
            <label for="cifrasASelect" class="control-label">Dividendo:</label>
            <select id="cifrasASelect">
                <option value="2">2 Cifras</option>
                <option value="3" selected>3 Cifras</option>
                <option value="4">4 Cifras</option>
            </select>
        </div>

        <div class="control-group">
            <label for="cifrasBSelect" class="control-label">Divisor:</label>
            <select id="cifrasBSelect">
                <option value="1" selected>1 Cifra</option>
                <option value="2">2 Cifras</option>
            </select>
        </div>
        
        <button id="newOperationButton" class="btn-action">Nueva División</button>
        <button id="toggleTableButton" class="btn-secondary">Mostrar Tabla</button>
    </div>
    
    <main class="contenido-principal">
        <div class="game-layout">
            <div id="divisionContainer" class="division-container"></div>
            <div id="helperTableContainer" class="helper-table-container hidden"></div>
        </div>

        <div class="score-buttons">
            <div class="button-row">
                <button class="digit-btn">1</button>
                <button class="digit-btn">2</button>
                <button class="digit-btn">3</button>
                <button class="digit-btn">4</button>
                <button class="digit-btn">5</button>
            </div>
            <div class="button-row">
                <button class="digit-btn">6</button>
                <button class="digit-btn">7</button>
                <button class="digit-btn">8</button>
                <button class="digit-btn">9</button>
                <button class="digit-btn">0</button>
            </div>                    
        </div>
    </main>
 </div>
   
 <script src="script.js"></script>
</body>
</html>
